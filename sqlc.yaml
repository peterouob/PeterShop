version: "2"
sql:
  - engine: "postgresql"
    queries: "service/seckill-service/internal/repository/queries"
    schema: "deploy/migrations/seckill"
    gen:
      go:
        package: "seckill"
        out: "service/seckill-service/internal/repository/db"
        sql_package: "pgx/v5"
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
