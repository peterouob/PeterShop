services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - my_bridge
    extra_hosts:
      - "host.docker.internal:192.168.0.100"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "82:8080"
    networks:
      - my_bridge
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:29092
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      - kafka
  db:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: "password"
      MYSQL_DATABASE: "seckill"
    ports:
      - "3307:3306"
    networks:
      - my_bridge
  redis:
    image: redis:latest
    restart: always
    ports:
      - "6380:6379"
    networks:
      - my_bridge
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - cluster.name=docker-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx1g"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - my_bridge
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - my_bridge
    depends_on:
      - elastic
  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.0
    container_name: logstash
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
    ports:
      - "5044:5044"
      - "9600:9600"
    environment:
      LS_JAVA_OPTS: "-Xms512m -Xmx512m"
    networks:
      - my_bridge
    depends_on:
      - elastic
      - kafka
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.0
    container_name: filebeat
    user: root
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ../../app_logs:/usr/share/filebeat/logs:ro
    networks:
      - my_bridge
    depends_on:
      - elastic
      - kafka
    command: filebeat -e -strict.perms=false
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.0
    restart: always
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - -initial-advertise-peer-urls=http://etcd:2380
      - -listen-peer-urls=http://0.0.0.0:2380
      - -initial-cluster-token=etcd-cluster-token
      - -initial-cluster=etcd=http://etcd:2380
      - -initial-cluster-state=new
    ports:
      - "2379:2379"
      - "2380:2380"
#    volumes:
#      - etcd_data:/bitnami/etcd
    healthcheck:
      test: [ "CMD", "etcdctl", "get", "health" ]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - my_bridge
  etcd_client:
    image: tzfun/etcd-workbench
    ports:
      - "8002:8002"
    depends_on:
      - etcd
    networks:
      - my_bridge
  user-service:
    profiles: ["services"]
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile
      args:
        TARGET: service/user-service/cmd
    container_name: user-service
    ports:
      - "50051:50051"
    environment:
      - GRPC_ADDR=:50051
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=seckill
      - REDIS_ADDR=redis:6379
      - KAFKA_BROKERS=kafka:29092
      - ETCD_ENDPOINTS=etcd:2379
      - JWT_SECRET=change-me-in-production
    networks:
      - my_bridge
    depends_on:
      - etcd
      - db
      - redis
networks:
  my_bridge:
    driver: bridge
volumes:
  es_data:
    driver: local
