apiVersion: apps/v1
kind: Deployment
metadata:
  name: seckill-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: seckill-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seckill-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: seckill-service
          image: seckill/seckill-service
          ports:
            - containerPort: 50052
              name: grpc
          env:
            - name: GRPC_ADDR
              value: ":50052"
          envFrom:
            - configMapRef:
                name: infra
            - secretRef:
                name: credentials
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          startupProbe:
            grpc:
              port: 50052
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            grpc:
              port: 50052
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 50052
            periodSeconds: 5
