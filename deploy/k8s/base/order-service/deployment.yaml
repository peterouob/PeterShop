apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: order-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-service
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: order-service
          image: seckill/order-service
          env:
            - name: PGUSER
              value: svc_order
            - name: PGDATABASE
              value: db_order
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: PGPASSWORD_order
          envFrom:
            - configMapRef:
                name: infra
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 512Mi
