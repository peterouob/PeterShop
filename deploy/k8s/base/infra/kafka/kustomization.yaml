apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: kafka-config
    envs:
      - kafka.properties

labels:
  - pairs:
      app.kubernetes.io/component: kafka
      app.kubernetes.io/part-of: infra
    includeTemplates: true
