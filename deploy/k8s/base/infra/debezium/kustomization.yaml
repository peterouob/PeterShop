apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml

configMapGenerator:
  - name: debezium-server
    files:
      - application.properties

labels:
  - pairs:
      app.kubernetes.io/component: debezium
      app.kubernetes.io/part-of: debezium
    includeTemplates: true