# send the data to kafka
debezium.sink.type=kafka
debezium.sink.kafka.producer.bootstrap.servers=kafka:9092
debezium.sink.kafka.producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer
debezium.sink.kafka.producer.value.serializer=org.apache.kafka.common.serialization.StringSerializer
# the link is at-least-once then snapshot will resend so consumer need to be idempotent
debezium.sink.kafka.producer.acks=all
debezium.sink.kafka.producer.enable.idempotence=true

# read pg wal
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=svc_cdc
debezium.source.database.password=${PGPASSWORD_cdc}
debezium.source.database.dbname=db_seckill
debezium.source.topic.prefix=seckill
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=seckill_outbox
debezium.source.publication.autocreate.mode=disabled
debezium.source.slot.name=seckill_outbox
debezium.source.table.include.list=public.outbox
debezium.source.snapshot.mode=when_needed
debezium.source.heartbeat.interval.ms=10000

debezium.source.tombstones.on.delete=false
# push the msg
debezium.source.heartbeat.action.query=SELECT pg_logical_emit_message(false, 'heartbeat', now()::varchar)
# only push in slot not push into kafka
debezium.source.message.prefix.exclude.list=heartbeat
debezium.source.offset.flush.interval.ms=5000

# offset read kafka
debezium.source.offset.storage=org.apache.kafka.connect.storage.KafkaOffsetBackingStore
debezium.source.offset.storage.topic=_debezium_offsets
debezium.source.offset.storage.partitions=1
# production should be 3 and offset need to be cleanup.policy=compact
debezium.source.offset.storage.replication.factor=1
debezium.source.bootstrap.servers=kafka:9092

# outbox route
debezium.predicates=isOutbox
debezium.predicates.isOutbox.type=org.apache.kafka.connect.transforms.predicates.TopicNameMatches
debezium.predicates.isOutbox.pattern=seckill\\.public\\.outbox
debezium.transforms=outbox
debezium.transforms.outbox.type=io.debezium.transforms.outbox.EventRouter
debezium.transforms.outbox.predicate=isOutbox
debezium.transforms.outbox.table.field.event.id=id
# need to make sure order_no not be null
debezium.transforms.outbox.table.field.event.key=order_no
debezium.transforms.outbox.table.field.event.payload=payload
debezium.transforms.outbox.route.by.field=aggregate_type
debezium.transforms.outbox.route.topic.replacement=seckill-order
debezium.transforms.outbox.table.expand.json.payload=true

# output format for JSON
debezium.format.key=json
debezium.format.value=json
debezium.format.key.schemas.enable=false
debezium.format.value.schemas.enable=false