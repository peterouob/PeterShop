apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: postgres-initdb
    files:
      - initdb.sh

labels:
  - pairs:
      app.kubernetes.io/component: postgres
      app.kubernetes.io/part-of: infra
    includeTemplates: true
